<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Pack</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #ffe082; color: #000000; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #ffc107; padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; }
        .logo-container img { height: 32px; width: auto; object-fit: contain; }
        nav a { text-decoration: none; color: #000000; font-weight: 500; font-size: 1rem; }
        nav a:hover { text-decoration: underline; }
        main { padding: 40px; max-width: 700px; margin: 0 auto; width: 100%; flex: 1; }
        h1 { font-size: 2rem; margin-bottom: 12px; }
        p { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        .card { background-color: rgba(255, 255, 255, 0.6); border: 1px solid #e0c060; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; color: #b78103; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #e0c060; border-radius: 4px; background-color: #ffffff; font-size: 0.95rem; margin-bottom: 15px; }
        button { width: 100%; background: #ffc107; color: #000; padding: 12px; border: none; border-radius: 4px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        button:hover { background: #e0ac00; }
        #statusMsg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="/favicon.png" alt="logo">
        </div>
        <nav>
            <a href="https://icorender.onrender.com">Home</a>
        </nav>
    </header>

    <main>
        <h1>Publish Community Pack</h1>
        <p>Upload your .icopack file to share it with the community. It will be automatically saved to the official repository structure.</p>

        <div class="card">
            <label for="authorInput">Author Name:</label>
            <input type="text" id="authorInput" placeholder="Your display name">

            <label for="fileInput">Select .icopack File:</label>
            <input type="file" id="fileInput" accept=".icopack">

            <button id="uploadBtn" onclick="uploadPack()">COMMIT & UPLOAD TO GITHUB</button>
            <div id="statusMsg"></div>
        </div>
    </main>

    <script>
        const owner = "canuxs";
        const repo = "icorender";
        const token = "__GITHUB_TOKEN__";

        async function uploadPack() {
            const author = document.getElementById('authorInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const statusMsg = document.getElementById('statusMsg');

            if (!author || fileInput.files.length === 0) {
                statusMsg.style.color = "#c62828";
                statusMsg.textContent = "Please enter an author name and select a file!";
                return;
            }

            const file = fileInput.files[0];
            statusMsg.style.color = "#b78103";
            statusMsg.textContent = "Checking file existence and preparing upload...";

            try {
                const base64Content = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const packFolderName = file.name.replace(/\.icopack$/i, '');
                const filePath = `community/data/${author}/${packFolderName}/${file.name}`;
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

                // Dosyanın daha önce var olup olmadığını kontrol et
                const checkRes = await fetch(apiUrl, {
                    headers: { 
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (checkRes.ok) {
                    throw new Error("This community pack already exists! You cannot overwrite an existing pack.");
                }

                const bodyData = {
                    message: `Add community pack by @${author}: ${file.name}`,
                    content: base64Content
                };

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!putRes.ok) {
                    const errJson = await putRes.json();
                    throw new Error(errJson.message || "GitHub upload failed");
                }

                statusMsg.style.color = "#2e7d32";
                statusMsg.textContent = "Successfully uploaded and committed to GitHub!";
            } catch (err) {
                statusMsg.style.color = "#c62828";
                statusMsg.textContent = `Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
